<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxygen Not Included Patch Tracker</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f9;
            color: #212529;
        }
        .navbar {
            background-color: #1a1d20 !important;
            border-bottom: 3px solid #0dcaf0;
        }
        .hero-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            border-radius: 16px;
        }
        .patch-card {
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .patch-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05) !important;
        }
        .patch-title {
            color: #0f172a;
            font-weight: 600;
        }
        .patch-snippet {
            color: #475569;
            font-size: 0.925rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .badge-date {
            background-color: #e2e8f0;
            color: #475569;
            font-weight: 500;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm py-3">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
        <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-info" href="index.html">
            🚀 ONI Update Hub
        </a>

        <div id="authContainer">
            <div id="loggedOutUI" class="d-flex flex-wrap gap-2">
                <input type="text" id="authUsername" class="form-control form-control-sm w-auto" placeholder="Username">
                <input type="password" id="authPassword" class="form-control form-control-sm w-auto" placeholder="Password">
                <button class="btn btn-info btn-sm text-dark fw-medium" onclick="handleLogin()">Login</button>
                <button class="btn btn-outline-light btn-sm" onclick="handleRegister()">Register</button>
            </div>

            <div id="loggedInUI" class="align-items-center gap-2 text-white d-none">
                <span class="me-2">Welcome, <strong id="displayUsername" class="text-info">User</strong>!</span>
                <button class="btn btn-sm btn-outline-warning" onclick="promptChangeUsername()">Rename</button>
                <button class="btn btn-sm btn-outline-light" onclick="handleLogout()">Logout</button>
                <button class="btn btn-sm btn-danger" onclick="handleDeleteAccount()">Delete Profile</button>
            </div>
        </div>
    </div>
</nav>

<div class="container my-4">

    <div class="hero-banner p-4 p-md-5 mb-5 shadow-sm d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-4">
        <div>
            <span class="badge bg-info text-dark mb-2 fw-semibold tracking-wider text-uppercase" style="font-size: 0.75rem;">Live Analytics</span>
            <h1 class="fw-bold mb-2" id="analysisTitle">Analyzing Colony Logs...</h1>
            <p class="text-light text-opacity-75 mb-0" id="analysisSubtitle">Fetching patch gaps directly from database vectors.</p>
        </div>
        <div>
            <button class="btn btn-info btn-lg text-dark fw-bold px-4 shadow" onclick="triggerForumsSync()">
                🔄 Sync Forum Database
            </button>
        </div>
    </div>

    <h3 class="fw-bold text-secondary mb-4">Latest Game Deployments</h3>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="patchGrid">
        <div class="col-12 text-center my-5 w-100">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Loading game database updates...</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        updateAuthUI();
        fetchAnalysisData();
        loadPatchGrid();
    });

    // --- DATABASE OPERATIONS & RENDERING ---
    function loadPatchGrid() {
        fetch('/api/patches')
            .then(res => res.json())
            .then(patches => {
                const grid = document.getElementById("patchGrid");
                if(patches.length === 0) {
                    grid.innerHTML = `<div class="col-12 w-100 text-center text-muted p-5 bg-white rounded shadow-sm">No updates found. Please trigger a forum sync above!</div>`;
                    return;
                }

                grid.innerHTML = patches.map(p => {
                    // Strip HTML tags safely to create a short, text-only description snippet
                    const tempDiv = document.createElement("div");
                    tempDiv.innerHTML = p.description;
                    const cleanSnippet = tempDiv.innerText || tempDiv.textContent || "";

                    return `
                        <div class="col">
                            <div class="card h-100 patch-card shadow-sm p-3">
                                <div class="card-body d-flex flex-column justify-content-between p-2">
                                    <div>
                                        <div class="d-flex justify-content-between align-items-start mb-3">
                                            <span class="badge badge-date py-2 px-3 rounded-pill">${new Date(p.releaseDate).toLocaleDateString()}</span>
                                            <span class="badge bg-light text-primary border border-primary-subtle fw-medium">${p.comments.length} Comments</span>
                                        </div>
                                        <h5 class="patch-title mb-2 fs-5">${p.title}</h5>
                                        <p class="patch-snippet mb-4">${cleanSnippet || 'No description summary available.'}</p>
                                    </div>
                                    <a href="patch-details.html?id=${p.id}" class="btn btn-outline-primary btn-sm w-100 mt-auto py-2 fw-medium">
                                        View Update Notes & Discussion →
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            });
    }

    function fetchAnalysisData() {
        fetch('/api/patches/time-since-last')
            .then(res => res.json())
            .then(data => {
                const title = document.getElementById("analysisTitle");
                const subtitle = document.getElementById("analysisSubtitle");
                if (data.daysSince !== -1) {
                    title.innerText = `${data.daysSince} Days Since Last Update`;
                    subtitle.innerText = `Current live version remains: "${data.patchTitle}"`;
                } else {
                    title.innerText = "No Logs Synchronized Yet";
                    subtitle.innerText = "Click the button to run the Jsoup crawler setup.";
                }
            });
    }

    function triggerForumsSync() {
        const btn = event.target;
        btn.disabled = true;
        btn.innerText = "⏳ Crawling Klei Forums...";

        fetch('/api/patches/sync')
            .then(() => {
                alert("Sync successful! The index database has refreshed completely.");
                location.reload();
            })
            .catch(() => {
                alert("Sync anomaly triggered. Verify forum web addresses.");
                btn.disabled = false;
                btn.innerText = "🔄 Sync Forum Database";
            });
    }

    // --- SESSION SECURITY STATE HANDLERS ---
    function updateAuthUI() {
        const user = localStorage.getItem("username");
        const loggedOut = document.getElementById("loggedOutUI");
        const loggedIn = document.getElementById("loggedInUI");
        const nameTarget = document.getElementById("displayUsername");

        if (user) {
            loggedOut.classList.add("d-none");
            loggedIn.classList.replace("d-none", "d-flex");
            nameTarget.innerText = user;
        } else {
            loggedOut.classList.remove("d-none");
            loggedIn.classList.replace("d-flex", "d-none");
        }
    }

    function handleRegister() {
        const u = document.getElementById("authUsername").value.trim();
        const p = document.getElementById("authPassword").value.trim();
        if (!u || !p) return alert("Credentials fields are required.");

        fetch("/api/users/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p })
        })
        .then(res => { if(!res.ok) throw new Error("Username already taken."); return res.json(); })
        .then(data => alert(`Profile '${data.username}' created successfully!`))
        .catch(err => alert(err.message));
    }

    function handleLogin() {
        const u = document.getElementById("authUsername").value.trim();
        const p = document.getElementById("authPassword").value.trim();
        if (!u || !p) return alert("Credentials fields are required.");

        fetch("/api/users/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p })
        })
        .then(res => { if(!res.ok) throw new Error("Invalid username or password match."); return res.json(); })
        .then(() => {
            localStorage.setItem("username", u);
            updateAuthUI();
            location.reload(); // Instantly update detail forms
        })
        .catch(err => alert(err.message));
    }

    function handleLogout() {
        fetch("/api/users/logout").then(() => {
            localStorage.removeItem("username");
            updateAuthUI();
            location.reload();
        });
    }

    function promptChangeUsername() {
        const newName = prompt("Enter new username:");
        if (!newName || !newName.trim()) return;

        fetch(`/api/users/change-username?newUsername=${encodeURIComponent(newName.trim())}`, { method: "PUT" })
        .then(res => { if(!res.ok) throw new Error("Name taken or transmission rejected."); return res.json(); })
        .then(data => {
            localStorage.setItem("username", data.username);
            updateAuthUI();
            alert("Username successfully updated!");
        })
        .catch(err => alert(err.message));
    }

    function handleDeleteAccount() {
        if (!confirm("Are you completely sure you want to delete your profile? This cannot be undone.")) return;

        fetch("/api/users/delete-account", { method: "DELETE" })
        .then(() => {
            localStorage.removeItem("username");
            updateAuthUI();
            location.reload();
        });
    }
</script>
</body>
</html>
